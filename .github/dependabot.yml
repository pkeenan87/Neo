version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      azure-sdk:
        patterns:
          - "@azure/*"
      bot-framework:
        patterns:
          - "botbuilder*"
          - "botframework*"
      # React + react-dom must travel together — React's peer-dep
      # requires the two packages to be exact-version matched, so a
      # solo `react-dom` bump (like PR #39 on 2026-05-11) fails npm ci
      # with ERESOLVE. The `@types/react*` counterparts ride along so
      # the TypeScript types don't drift behind the runtime version.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /functions/csv-cleanup
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
