name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  web-checks:
    name: Web — typecheck / lint / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      # The repo currently carries 12 known moderate vulnerabilities
      # (botbuilder/msal-node chain, fast-xml-parser, postcss). Dependabot
      # is enabled in the same PR and will work them down. Until then,
      # block only on `high` so we don't fail every PR on pre-existing
      # debt. Flip to --audit-level=moderate once the queue is clear.
      - name: npm audit (high+ only)
        run: npm audit --audit-level=high
        continue-on-error: true

  cli-checks:
    name: CLI — install / audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install
        run: npm ci
      # Symmetric with the web job: don't fail PRs on a fresh upstream
      # advisory before Dependabot has had a chance to land a fix. Flip
      # to fail-closed once Dependabot is steady-state.
      - name: npm audit (high+ only)
        run: npm audit --audit-level=high
        continue-on-error: true

  codeql:
    name: CodeQL (security-extended)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
